<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking · bensn.me</title>
<meta name="description" content="Habit Tracking — Konsum, Verbrauch, Gewohnheiten.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracking">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/bensn.css">
<style>
body { overscroll-behavior: none; }

.app-wrap {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 0 1.25rem 4rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Tabs ── */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; gap: 0; }
.tab {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: 9px 14px;
  cursor: pointer;
  color: var(--muted);
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  background: none;
  transition: color .15s, border-color .15s;
}
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.tab:hover:not(.active) { color: var(--text); }
.tab-section { display: none; }
.tab-section.visible { display: block; }

/* ── Category Group ── */
.cat-group {
  margin-bottom: 1.5rem;
}
.cat-header {
  display: flex;
  align-items: center;
  gap: .6rem;
  margin-bottom: .75rem;
}
.cat-icon {
  font-size: 14px;
  line-height: 1;
}
.cat-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.cat-today-total {
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
}

/* ── Item Card ── */
.item-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem 1.25rem;
  margin-bottom: 6px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: .75rem;
  align-items: center;
  transition: border-color .15s;
}
.item-card:hover { border-color: var(--border-hover); }

.item-name {
  font-family: 'Syne', sans-serif;
  font-size: .95rem;
  font-weight: 700;
  letter-spacing: -.01em;
  margin-bottom: 2px;
}
.item-meta {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
}
.item-today {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.item-today span {
  color: var(--text);
  font-weight: 500;
}

.item-actions {
  display: flex;
  align-items: center;
  gap: .4rem;
  flex-shrink: 0;
}

.btn-unit {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .04em;
  background: none;
  border: 1px solid var(--border-hover);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 13px;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.btn-unit:hover {
  background: rgba(255,255,255,.06);
  border-color: rgba(255,255,255,.3);
}
.btn-unit:active {
  background: rgba(255,255,255,.1);
  transform: scale(.96);
}

.btn-manual {
  width: 30px;
  height: 30px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color .15s, color .15s;
  flex-shrink: 0;
  padding: 0;
}
.btn-manual:hover {
  border-color: var(--border-hover);
  color: var(--text);
}

/* Color accents per category */
.cat-kiffen .item-card { border-left: 2px solid rgba(74,222,128,.25); }
.cat-kiffen .btn-unit  { border-color: rgba(74,222,128,.4); color: var(--green); }
.cat-kiffen .btn-unit:hover { background: rgba(74,222,128,.08); border-color: rgba(74,222,128,.7); }

.cat-rauchen .item-card { border-left: 2px solid rgba(232,114,74,.25); }
.cat-rauchen .btn-unit  { border-color: rgba(232,114,74,.4); color: var(--orange); }
.cat-rauchen .btn-unit:hover { background: rgba(232,114,74,.08); border-color: rgba(232,114,74,.7); }

.cat-lebensmittel .item-card { border-left: 2px solid rgba(0,166,251,.25); }
.cat-lebensmittel .btn-unit  { border-color: rgba(0,166,251,.4); color: var(--accent-blue); }
.cat-lebensmittel .btn-unit:hover { background: rgba(0,166,251,.08); border-color: rgba(0,166,251,.7); }

/* ── Today summary bar ── */
.today-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: .85rem 1.25rem;
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.today-date {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.today-entry-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.today-entry-count span { color: var(--text); font-weight: 500; }

/* ── History ── */
.history-day {
  margin-bottom: 1.5rem;
}
.history-day-header {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: .5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: .75rem;
}
.history-entry {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .5rem 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.history-time {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  width: 42px;
  flex-shrink: 0;
}
.history-name {
  font-family: 'Syne', sans-serif;
  font-size: .85rem;
  font-weight: 600;
  flex: 1;
  min-width: 0;
}
.history-amount {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.history-amount span { color: var(--text); font-weight: 500; }
.history-delete {
  width: 24px;
  height: 24px;
  background: none;
  border: none;
  color: rgba(255,0,81,.3);
  cursor: pointer;
  font-size: 14px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  transition: color .15s, background .15s;
  flex-shrink: 0;
}
.history-delete:hover { color: var(--accent-red); background: rgba(255,0,81,.08); }

.history-day-totals {
  margin-top: .5rem;
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
}
.history-total-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--muted);
}

/* ── Manual input overlay ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.overlay-sheet {
  background: #161616;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px 16px 0 0;
  padding: 1.5rem 1.25rem 2.5rem;
  width: 100%;
  max-width: 480px;
}
.overlay-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1rem;
}
.overlay-item-name {
  font-family: 'Syne', sans-serif;
  font-size: 1.3rem;
  font-weight: 800;
  margin-bottom: 1.25rem;
  letter-spacing: -.02em;
}
.overlay-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}
.overlay-input-row {
  display: flex;
  align-items: center;
  gap: .5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: .5rem .75rem;
  margin-bottom: .75rem;
}
.overlay-input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 1.4rem;
  font-weight: 500;
  outline: none;
  min-width: 0;
}
.overlay-unit-label {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  flex-shrink: 0;
}
.overlay-presets {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-bottom: 1.25rem;
}
.overlay-preset {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  cursor: pointer;
  transition: all .15s;
}
.overlay-preset:hover {
  border-color: var(--border-hover);
  color: var(--text);
  background: rgba(255,255,255,.04);
}
.overlay-note-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  outline: none;
  margin-bottom: 1rem;
}
.overlay-note-input::placeholder { color: var(--muted); }
.overlay-btns {
  display: flex;
  gap: .5rem;
}
.btn-save {
  flex: 1;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .06em;
  background: var(--green);
  color: #0a0a0b;
  border: none;
  border-radius: 8px;
  padding: 11px;
  cursor: pointer;
}
.btn-cancel {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: 11px 18px;
  cursor: pointer;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1e1e20;
  border: 1px solid var(--border-hover);
  border-radius: 8px;
  padding: 9px 18px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text);
  z-index: 200;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Footer ── */
.app-footer {
  border-top: 1px solid var(--border);
  padding: 1rem 0;
  display: flex;
  justify-content: space-between;
  margin-top: auto;
}
.app-footer span {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}

/* ── Empty state ── */
.empty-state {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 2.5rem 1rem;
  border: 1px dashed var(--border);
  border-radius: 16px;
  line-height: 1.8;
}

@media (max-width: 560px) {
  .item-name { font-size: .9rem; }
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="blobs" id="blobs"></div>

<div class="app-wrap">

  <!-- Navbar -->
  <nav class="app-nav">
    <a href="https://bensn.me" class="nav-crumb"><span>bensn</span>.me</a>
    <span class="nav-sep">/</span>
    <span class="nav-current">tracking</span>
    <div class="nav-right">
      <div class="dot" style="background:var(--green);animation:pulse 2s ease-in-out infinite"></div>
      <span id="entry-count-nav">–</span>
    </div>
  </nav>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('heute',this)">Heute</button>
    <button class="tab" onclick="switchTab('verlauf',this)">Verlauf</button>
  </div>

  <!-- ═══ TAB: HEUTE ═══ -->
  <div id="tab-heute" class="tab-section visible">

    <div class="today-bar">
      <span class="today-date" id="today-date-label">—</span>
      <span class="today-entry-count"><span id="today-count">0</span> Einträge heute</span>
    </div>

    <!-- Kiffen -->
    <div class="cat-group cat-kiffen">
      <div class="cat-header">
        <span class="cat-icon">🌿</span>
        <span class="cat-title">Kiffen</span>
        <span class="cat-today-total" id="total-kiffen">—</span>
      </div>
      <div id="items-kiffen"></div>
    </div>

    <!-- Rauchen -->
    <div class="cat-group cat-rauchen">
      <div class="cat-header">
        <span class="cat-icon">🚬</span>
        <span class="cat-title">Rauchen</span>
        <span class="cat-today-total" id="total-rauchen">—</span>
      </div>
      <div id="items-rauchen"></div>
    </div>

    <!-- Lebensmittel -->
    <div class="cat-group cat-lebensmittel">
      <div class="cat-header">
        <span class="cat-icon">☕</span>
        <span class="cat-title">Lebensmittel</span>
        <span class="cat-today-total" id="total-lebensmittel">—</span>
      </div>
      <div id="items-lebensmittel"></div>
    </div>

  </div>

  <!-- ═══ TAB: VERLAUF ═══ -->
  <div id="tab-verlauf" class="tab-section">
    <div id="verlauf-content"></div>
  </div>

  <footer class="app-footer">
    <span>tracking.bensn.me</span>
    <span id="footer-clock"></span>
  </footer>
</div>

<!-- Manual Input Overlay -->
<div id="overlay" class="overlay" style="display:none" onclick="closeOverlay(event)">
  <div class="overlay-sheet" onclick="event.stopPropagation()">
    <div class="overlay-title">Eintrag hinzufügen</div>
    <div class="overlay-item-name" id="overlay-name">—</div>
    <div class="overlay-label">Menge</div>
    <div class="overlay-input-row">
      <input class="overlay-input" id="overlay-amount" type="number" min="0" step="any" placeholder="0">
      <span class="overlay-unit-label" id="overlay-unit">g</span>
    </div>
    <div class="overlay-presets" id="overlay-presets"></div>
    <div class="overlay-label">Notiz (optional)</div>
    <input class="overlay-note-input" id="overlay-note" type="text" placeholder="z.B. Abends, nach dem Dienst…">
    <div class="overlay-btns">
      <button class="btn-save" onclick="submitManual()">Hinzufügen</button>
      <button class="btn-cancel" onclick="document.getElementById('overlay').style.display='none'">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/shared/bensn.js"></script>
<script>
/* ════════════════════════════════════════════════════
   CONFIG — Items Definition
   unit_label: Anzeige-Einheit
   unit_size: 1 Einheit = X (in der Basis-Einheit)
   base_unit: die gespeicherte Einheit
   presets: Schnellauswahl-Werte für manuellen Dialog
   ════════════════════════════════════════════════════ */
const ITEMS = [
  /* ── Kiffen ── */
  {
    id: 'weed',
    category: 'kiffen',
    name: 'Weed',
    unit_label: 'g',
    unit_size: 0.3,
    base_unit: 'g',
    presets: [0.1, 0.3, 0.5, 1, 2],
  },
  {
    id: 'filter-joint',
    category: 'kiffen',
    name: 'Filter',
    unit_label: 'Stk.',
    unit_size: 1,
    base_unit: 'Stk.',
    presets: [1, 3, 5, 10],
  },
  {
    id: 'papes-joint',
    category: 'kiffen',
    name: 'Papes',
    unit_label: 'Stk.',
    unit_size: 1,
    base_unit: 'Stk.',
    presets: [1, 5, 10, 20],
  },

  /* ── Rauchen ── */
  {
    id: 'papes-tabak',
    category: 'rauchen',
    name: 'Papes',
    unit_label: 'Stk.',
    unit_size: 1,
    base_unit: 'Stk.',
    presets: [1, 5, 10, 20, 50],
  },
  {
    id: 'filter-tabak',
    category: 'rauchen',
    name: 'Filter',
    unit_label: 'Stk.',
    unit_size: 1,
    base_unit: 'Stk.',
    presets: [1, 5, 10, 20, 50],
  },
  {
    id: 'tabak',
    category: 'rauchen',
    name: 'Tabak',
    unit_label: 'g',
    unit_size: 10,
    base_unit: 'g',
    presets: [5, 10, 25, 50, 100],
    pack_size: 1000,
    pack_label: 'Packung (1000g)',
  },

  /* ── Lebensmittel ── */
  {
    id: 'kaffee',
    category: 'lebensmittel',
    name: 'Kaffee',
    unit_label: 'g',
    unit_size: 10,
    base_unit: 'g',
    presets: [10, 25, 50, 100, 250],
  },
  {
    id: 'redbull',
    category: 'lebensmittel',
    name: 'Red Bull',
    unit_label: 'Dose',
    unit_size: 250,
    base_unit: 'ml',
    display_unit: 'ml',
    presets: [125, 250, 500],
  },
];

const STORAGE_KEY = 'bensn_tracking_v1';

/* ════════════════════════════════════════════════════
   STORAGE
   ════════════════════════════════════════════════════ */
function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function addEntry(itemId, amount, note='') {
  const data = loadData();
  const item = ITEMS.find(i => i.id === itemId);
  if(!item) return;
  // amount is in base_unit
  const stored_amount = item.id === 'redbull' ? amount : amount; // ml or unit
  data.push({
    id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2),
    item_id: itemId,
    category: item.category,
    name: item.name,
    amount: stored_amount,
    unit: item.base_unit,
    note: note || null,
    timestamp: new Date().toISOString(),
    date: todayKey(),
  });
  saveData(data);
}

function deleteEntry(entryId) {
  const data = loadData().filter(e => e.id !== entryId);
  saveData(data);
}

/* ════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════ */
function pad(n){ return String(n).padStart(2,'0'); }

function fmtAmount(amount, item) {
  if(!item) return amount;
  // Red Bull: show in Dosen if ≥ 250ml, else ml
  if(item.id === 'redbull') {
    if(amount >= 250 && amount % 250 === 0) {
      const dosen = amount / 250;
      return `${dosen} Dose${dosen>1?'n':''}`;
    }
    return `${amount} ml`;
  }
  // Tabak: show in g, optionally note Packungen
  if(item.base_unit === 'g') {
    if(amount >= 1000) {
      const pack = Math.floor(amount/1000);
      const rest = amount%1000;
      return rest > 0 ? `${pack}Pkg ${rest}g` : `${pack} Pkg`;
    }
    return `${amount}g`;
  }
  return `${amount} ${item.base_unit}`;
}

function entriesForDate(date) {
  return loadData().filter(e => e.date === date);
}

function totalsForDate(date) {
  const entries = entriesForDate(date);
  const totals = {};
  entries.forEach(e => {
    totals[e.item_id] = (totals[e.item_id] || 0) + e.amount;
  });
  return totals;
}

/* ════════════════════════════════════════════════════
   RENDER — Today
   ════════════════════════════════════════════════════ */
function renderToday() {
  const today = todayKey();
  const todayEntries = entriesForDate(today);
  const totals = totalsForDate(today);

  // Date label
  const d = new Date();
  const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  document.getElementById('today-date-label').textContent =
    `${days[d.getDay()]}, ${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;

  document.getElementById('today-count').textContent = todayEntries.length;
  document.getElementById('entry-count-nav').textContent = todayEntries.length + ' heute';

  // Category totals (header badges)
  const cats = ['kiffen','rauchen','lebensmittel'];
  cats.forEach(cat => {
    const catItems = ITEMS.filter(i => i.category === cat);
    const catTotal = catItems.reduce((sum, item) => {
      return sum + (totals[item.id] || 0);
    }, 0);
    const el = document.getElementById(`total-${cat}`);
    if(catTotal > 0) {
      const entryCount = todayEntries.filter(e => catItems.some(i => i.id === e.item_id)).length;
      el.textContent = `${entryCount} Eintr.`;
    } else {
      el.textContent = '';
    }
  });

  // Render each category's items
  cats.forEach(cat => {
    const container = document.getElementById(`items-${cat}`);
    const catItems = ITEMS.filter(i => i.category === cat);
    container.innerHTML = '';
    catItems.forEach(item => {
      const dayTotal = totals[item.id] || 0;
      const entryCount = todayEntries.filter(e => e.item_id === item.id).length;

      // Unit button label
      let unitBtnLabel;
      if(item.id === 'redbull') {
        unitBtnLabel = `+1 Dose`;
      } else if(item.base_unit === 'g') {
        unitBtnLabel = `+${item.unit_size}g`;
      } else {
        unitBtnLabel = `+1`;
      }

      // Today display
      let todayDisplay = '—';
      if(dayTotal > 0) {
        todayDisplay = fmtAmount(dayTotal, item);
        if(entryCount > 1) todayDisplay += ` (${entryCount}×)`;
      }

      container.innerHTML += `
        <div class="item-card">
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-meta">1 Einheit = ${item.id==='redbull'?'250 ml':(item.unit_size+' '+item.base_unit)} · ${item.base_unit}</div>
            <div class="item-today">Heute: <span>${todayDisplay}</span></div>
          </div>
          <div class="item-actions">
            <button class="btn-unit" onclick="quickAdd('${item.id}')">${unitBtnLabel}</button>
            <button class="btn-manual" onclick="openManual('${item.id}')" title="Manuell eingeben">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M11.5 1.5l3 3-9 9H2.5v-3l9-9z"/>
              </svg>
            </button>
          </div>
        </div>`;
    });
  });
}

/* ════════════════════════════════════════════════════
   RENDER — Verlauf
   ════════════════════════════════════════════════════ */
function renderVerlauf() {
  const container = document.getElementById('verlauf-content');
  const data = loadData();

  if(data.length === 0) {
    container.innerHTML = '<div class="empty-state">Noch keine Einträge.<br>Füge deinen ersten Eintrag über "Heute" hinzu.</div>';
    return;
  }

  // Group by date descending
  const byDate = {};
  data.forEach(e => {
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  const dates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).slice(0,30);
  container.innerHTML = '';

  dates.forEach(date => {
    const entries = byDate[date].sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
    const [y,m,d] = date.split('-');
    const dd = new Date(+y, +m-1, +d);
    const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];
    const today = todayKey();
    const dateLabel = date === today ? 'Heute'
      : date === (() => { const x=new Date(); x.setDate(x.getDate()-1); return x.toISOString().split('T')[0]; })() ? 'Gestern'
      : `${days[dd.getDay()]}, ${d}.${m}.${y}`;

    // Per-item day totals
    const totals = {};
    entries.forEach(e => { totals[e.item_id] = (totals[e.item_id]||0) + e.amount; });
    const totalBadges = Object.entries(totals).map(([itemId, amt]) => {
      const item = ITEMS.find(i=>i.id===itemId);
      return `<span class="history-total-badge">${item?item.name:'?'}: ${fmtAmount(amt,item)}</span>`;
    }).join('');

    const entryRows = entries.map(e => {
      const item = ITEMS.find(i=>i.id===e.item_id);
      const t = new Date(e.timestamp);
      const timeStr = `${pad(t.getHours())}:${pad(t.getMinutes())}`;
      return `<div class="history-entry">
        <span class="history-time">${timeStr}</span>
        <span class="history-name">${e.name}</span>
        <span class="history-amount"><span>${fmtAmount(e.amount,item)}</span>${e.note?` · ${e.note}`:''}</span>
        <button class="history-delete" onclick="confirmDelete('${e.id}')" title="Löschen">×</button>
      </div>`;
    }).join('');

    container.innerHTML += `
      <div class="history-day">
        <div class="history-day-header">${dateLabel} · ${entries.length} Eintr.</div>
        ${entryRows}
        <div class="history-day-totals">${totalBadges}</div>
      </div>`;
  });
}

/* ════════════════════════════════════════════════════
   ACTIONS
   ════════════════════════════════════════════════════ */
let _overlayItemId = null;

function quickAdd(itemId) {
  const item = ITEMS.find(i=>i.id===itemId);
  if(!item) return;
  const amount = item.id === 'redbull' ? 250 : item.unit_size;
  addEntry(itemId, amount);
  showToast(`${item.name} +${fmtAmount(amount, item)}`);
  renderToday();
}

function openManual(itemId) {
  const item = ITEMS.find(i=>i.id===itemId);
  if(!item) return;
  _overlayItemId = itemId;
  document.getElementById('overlay-name').textContent = item.name;
  document.getElementById('overlay-unit').textContent = item.base_unit;
  document.getElementById('overlay-amount').value = '';
  document.getElementById('overlay-note').value = '';

  // Presets
  const presetsEl = document.getElementById('overlay-presets');
  presetsEl.innerHTML = '';
  const ps = item.presets || [];
  if(item.pack_size) ps.push(item.pack_size);
  ps.forEach(p => {
    const label = item.id==='redbull' ? (p>=250&&p%250===0?`${p/250} Dose${p/250>1?'n':''}`:`${p} ml`) : `${p} ${item.base_unit}`;
    presetsEl.innerHTML += `<button class="overlay-preset" onclick="document.getElementById('overlay-amount').value='${p}'">${label}</button>`;
  });
  if(item.pack_label) {
    // already added above
  }

  document.getElementById('overlay').style.display = 'flex';
  setTimeout(()=>document.getElementById('overlay-amount').focus(), 100);
}

function closeOverlay(e) {
  document.getElementById('overlay').style.display = 'none';
}

function submitManual() {
  const item = ITEMS.find(i=>i.id===_overlayItemId);
  if(!item) return;
  const raw = parseFloat(document.getElementById('overlay-amount').value);
  if(!raw || raw <= 0) {
    document.getElementById('overlay-amount').focus();
    return;
  }
  const note = document.getElementById('overlay-note').value;
  addEntry(item.id, raw, note);
  document.getElementById('overlay').style.display = 'none';
  showToast(`${item.name} +${fmtAmount(raw, item)}`);
  renderToday();
  if(document.getElementById('tab-verlauf').classList.contains('visible')) renderVerlauf();
}

function confirmDelete(entryId) {
  if(!confirm('Eintrag löschen?')) return;
  deleteEntry(entryId);
  renderToday();
  renderVerlauf();
}

/* ════════════════════════════════════════════════════
   TABS
   ════════════════════════════════════════════════════ */
function switchTab(t, el) {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-heute').classList.toggle('visible', t==='heute');
  document.getElementById('tab-verlauf').classList.toggle('visible', t==='verlauf');
  if(t==='verlauf') renderVerlauf();
}

/* ════════════════════════════════════════════════════
   TOAST
   ════════════════════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ════════════════════════════════════════════════════
   CLOCK
   ════════════════════════════════════════════════════ */
function clockTick() {
  const n = new Date();
  const el = document.getElementById('footer-clock');
  if(el) el.textContent = pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
clockTick(); setInterval(clockTick, 1000);

/* ════════════════════════════════════════════════════
   KEYBOARD SHORTCUT — Enter submits overlay
   ════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.getElementById('overlay').style.display !== 'none') {
    submitManual();
  }
  if(e.key === 'Escape') {
    document.getElementById('overlay').style.display = 'none';
  }
});

/* ── INIT ── */
renderToday();
</script>
